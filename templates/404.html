<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Digital Shadow</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="nav" role="navigation" aria-label="Main navigation">
  <a href="/" class="nav-brand">
    <div class="brand-icon" aria-hidden="true">🛡</div>
    <span>Digital Shadow</span>
  </a>
  <div class="nav-links" id="nav-links">
    <a href="/" class="nav-link">Analyzer</a>
    <a href="/about" class="nav-link">About</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
  </button>
</nav>

<main class="container" style="padding-top:80px;" id="main-content">
  <div class="empty-state">
    <div class="empty-state-icon">🔍</div>
    <h1 class="empty-state-title" style="font-size:2rem;">
      {{ code | default(404) }} — {{ message | default('Page Not Found') }}
    </h1>
    <p class="empty-state-text" style="margin-top:12px;max-width:400px;margin-left:auto;margin-right:auto;">
      The page you were looking for doesn't exist or has been moved.
    </p>
    <div style="margin-top:32px;">
      <a href="/" class="btn btn-primary">← Back to Analyzer</a>
    </div>
  </div>
</main>

<footer class="footer" role="contentinfo">
  <div class="footer-brand"><span aria-hidden="true">🛡</span> Digital Shadow</div>
  <span>Privacy Risk Analyzer</span>
</footer>
</body>
</html>
